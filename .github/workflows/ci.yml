name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: No solution yet
        if: hashFiles('**/*.sln') == ''
        run: echo "No solution file yet, skipping build and test."

      - name: Restore
        if: hashFiles('**/*.sln') != ''
        run: dotnet restore

      - name: Format check
        if: hashFiles('**/*.sln') != ''
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        if: hashFiles('**/*.sln') != ''
        run: dotnet build --no-restore -c Release

      - name: Test
        if: hashFiles('**/*.sln') != ''
        run: dotnet test --no-build -c Release --logger "trx"
